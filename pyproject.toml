[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rfc5322"
version = "1.0.0"
description = "RFC 5322 conformant email address parser — dependency-free, spec-tested, with full obsolete-grammar support"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
# SPDX expression (PEP 639). The text of the licence ships via license-files.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdul Afif Al Kaysan", email = "alkaysan07@gmail.com" }]
keywords = [
    "rfc5322",
    "rfc 5322",
    "email",
    "e-mail",
    "address",
    "parser",
    "validation",
    "abnf",
    "mailbox",
    "addr-spec",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Dev/test-only: the differential harness in fuzz/ compares against
# email_validator. Never a runtime dependency — `dependencies` above stays [].
fuzz = [
    "email-validator>=2.0",
]

[project.urls]
Homepage = "https://github.com/beduldul/rfc5322"
Repository = "https://github.com/beduldul/rfc5322"
Source = "https://github.com/beduldul/rfc5322"
Issues = "https://github.com/beduldul/rfc5322/issues"
Changelog = "https://github.com/beduldul/rfc5322/blob/main/CHANGELOG.md"

[project.scripts]
rfc5322 = "rfc5322.__main__:main"

[tool.setuptools.packages.find]
include = ["rfc5322*"]

[tool.setuptools.package-data]
rfc5322 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
